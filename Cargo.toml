[workspace]
members = ["crates/core", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
sysinfo = "0.40"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
